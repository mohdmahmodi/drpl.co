<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>drpl.co - Offline</title>
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <style>
      :root {
        --bg: #ffffff;
        --ink: #17181a;
        --ink-2: #66686c;
        --line: #e8e7e5;
        --accent: #f6821f;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161616;
          --ink: #ededec;
          --ink-2: #a4a4a2;
          --line: #2b2b2a;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }

      .card {
        max-width: 380px;
      }

      .mark {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--accent);
        margin: 0 auto 18px;
      }

      h1 {
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.01em;
        margin-bottom: 8px;
      }

      p {
        font-size: 14px;
        line-height: 1.6;
        color: var(--ink-2);
        margin-bottom: 22px;
      }

      button {
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        height: 38px;
        padding: 0 18px;
        border-radius: 8px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #221204;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"></div>
      <h1>You're offline</h1>
      <p>
        drpl.co needs a network connection to find your other devices. Connect
        to Wi-Fi and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
