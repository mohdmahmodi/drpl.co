<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>drpl.co - Offline</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <style>
      /* Token values mirror styles.css. They are inlined rather than linked
         because this page has to render with no network at all. */
      :root {
        --bg: #f1f1f1;
        --surface: #ffffff;
        --text: #171717;
        --muted: #6b6b6b;
        --border: rgba(0, 0, 0, 0.08);
        --action: #171717;
        --on-action: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1b1b;
          --surface: #212121;
          --text: #fafafa;
          --muted: #a3a3a3;
          --border: rgba(255, 255, 255, 0.08);
          --action: #ebebeb;
          --on-action: #171717;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        font-family:
          "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }

      .card {
        max-width: 380px;
      }

      .mark {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--action);
        margin: 0 auto 18px;
      }

      h1 {
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.01em;
        margin-bottom: 8px;
      }

      p {
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
        margin-bottom: 22px;
      }

      button {
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        height: 38px;
        padding: 0 18px;
        border-radius: 10px;
        border: 1px solid var(--action);
        background: var(--action);
        color: var(--on-action);
        cursor: pointer;
      }

      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"></div>
      <h1>You're offline</h1>
      <p>
        drpl.co needs a network connection to find your other devices. Connect
        to Wi-Fi and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
