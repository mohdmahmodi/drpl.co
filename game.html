<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Don't Crash</title>
    <style>
      :root {
        --page: #17171d;
        --shell: #a7a6bb;
        --shell-dark: #5654a3;
        --blue: #69a2ef;
        --blue-dark: #376dcc;
        --ink: #171a23;
        --paper: #f4f3ee;
        --track: #ffffff;
        --border: #353743;
        --danger: #d34848;
        --success: #3ca76f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: radial-gradient(
          circle at 50% 10%,
          #272833 0,
          #17171d 45%,
          #111116 100%
        );
        color: white;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
      }

      body {
        display: grid;
        place-items: center;
        padding: 18px;
        overscroll-behavior: none;
      }

      button,
      input {
        font: inherit;
      }

      .game-shell {
        width: min(94vw, 480px);
        border: 2px solid rgba(255, 255, 255, 0.13);
        border-radius: 15px;
        overflow: hidden;
        background: var(--shell);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.48);
        user-select: none;
        touch-action: none;
      }

      .challenge-header {
        min-height: 128px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 24px 26px;
        background: var(--blue);
        border-bottom: 4px solid #384578;
        color: white;
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.18);
      }

      .eyebrow {
        margin: 0 0 7px;
        font-size: clamp(0.78rem, 2.6vw, 0.95rem);
        opacity: 0.96;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.65rem, 7vw, 2.5rem);
        line-height: 0.95;
        letter-spacing: -0.07em;
        font-weight: 800;
      }

      .status-pill {
        flex: 0 0 auto;
        min-width: 76px;
        padding: 9px 11px;
        border: 2px solid rgba(255, 255, 255, 0.72);
        border-radius: 999px;
        background: rgba(43, 72, 145, 0.28);
        text-align: center;
        font-weight: 800;
        font-size: 0.82rem;
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.25);
      }

      .game-panel {
        position: relative;
        margin: 12px;
        border: 2px solid var(--border);
        background: var(--paper);
        box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.7);
      }

      .canvas-wrap {
        position: relative;
        aspect-ratio: 5 / 6;
        width: 100%;
        overflow: hidden;
        background: #9ea09d;
        border-bottom: 2px solid var(--border);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }

      .hud {
        position: absolute;
        inset: 10px 10px auto 10px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: none;
        text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.6);
        font-weight: 900;
      }

      .hud-box {
        padding: 6px 9px;
        border: 2px solid rgba(255, 255, 255, 0.75);
        border-radius: 8px;
        background: rgba(27, 30, 39, 0.72);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
        font-size: 0.82rem;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(17, 18, 24, 0.7);
        backdrop-filter: blur(3px);
        text-align: center;
      }

      .overlay[hidden] {
        display: none;
      }

      .overlay-card {
        width: min(100%, 320px);
        padding: 22px;
        border: 3px solid white;
        border-radius: 10px;
        background: #262936;
        box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.3);
      }

      .overlay-card h2 {
        margin: 0 0 10px;
        font-size: 1.55rem;
        letter-spacing: -0.04em;
      }

      .overlay-card p {
        margin: 0 0 18px;
        color: #dadce7;
        line-height: 1.45;
        font-size: 0.92rem;
      }

      .primary-button {
        width: 100%;
        min-height: 46px;
        border: 0;
        border-bottom: 4px solid #244d9e;
        border-radius: 8px;
        background: var(--blue);
        color: white;
        font-weight: 900;
        cursor: pointer;
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.25);
      }

      .primary-button:active {
        transform: translateY(2px);
        border-bottom-width: 2px;
      }

      .controls {
        padding: 17px 14px 18px;
        background: #f3f2ed;
        color: var(--ink);
      }

      .control-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 0 3px 10px;
        font-size: 0.78rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .slider {
        position: relative;
        height: 50px;
        border: 2px solid #343641;
        border-radius: 999px;
        background: var(--track);
        box-shadow: inset 0 3px 0 rgba(0, 0, 0, 0.1);
        cursor: ew-resize;
        touch-action: none;
      }

      .slider::before {
        content: "";
        position: absolute;
        left: 13px;
        right: 13px;
        top: 50%;
        height: 5px;
        transform: translateY(-50%);
        border-radius: 999px;
        background: #cfd2d8;
        box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.18);
      }

      .slider-thumb {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 74px;
        height: 58px;
        transform: translate(-50%, -50%);
        display: grid;
        place-items: center;
        border: 2px solid #244e9f;
        border-bottom-width: 5px;
        border-radius: 11px;
        background: #659cf0;
        color: white;
        font-size: 1.35rem;
        font-weight: 900;
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.35),
          0 3px 7px rgba(0, 0, 0, 0.16);
        outline: none;
      }

      .slider-thumb:focus-visible {
        box-shadow:
          0 0 0 4px rgba(60, 111, 210, 0.35),
          inset 0 2px 0 rgba(255, 255, 255, 0.35);
      }

      .slider.dragging .slider-thumb {
        transform: translate(-50%, -50%) scale(1.04);
      }

      .fine-print {
        margin: 13px 4px 0;
        color: #60636d;
        font-size: 0.7rem;
        line-height: 1.4;
        text-align: center;
      }

      @media (max-width: 430px) {
        body {
          padding: 8px;
        }
        .challenge-header {
          min-height: 105px;
          padding: 18px;
        }
        .game-panel {
          margin: 8px;
        }
        .status-pill {
          min-width: 67px;
          font-size: 0.74rem;
        }
        .controls {
          padding-inline: 10px;
        }
        .slider-thumb {
          width: 65px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .slider-thumb,
        .primary-button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="game-shell" aria-label="Don't Crash driving game">
      <header class="challenge-header">
        <div>
          <p class="eyebrow">Steer the car and</p>
          <h1>don't crash</h1>
        </div>
        <div class="status-pill" id="statusPill">READY</div>
      </header>

      <section class="game-panel">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas
            id="gameCanvas"
            aria-label="Six lane road driving game"
          ></canvas>

          <div class="hud" aria-hidden="true">
            <div class="hud-box">TIME <span id="timeText">30.0</span></div>
            <div class="hud-box">SCORE <span id="scoreText">0000</span></div>
          </div>

          <div class="overlay" id="overlay">
            <div class="overlay-card">
              <h2 id="overlayTitle">Ready?</h2>
              <p id="overlayText">
                Use the slider, arrow keys, A/D, or drag directly across the
                control. Survive for 30 seconds.
              </p>
              <button class="primary-button" id="startButton" type="button">
                Start driving
              </button>
            </div>
          </div>
        </div>

        <div class="controls">
          <div class="control-label">
            <span>Steering</span>
            <span id="laneReadout">Center</span>
          </div>
          <div
            class="slider"
            id="slider"
            role="slider"
            aria-label="Steering"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="50"
            tabindex="-1"
          >
            <div
              class="slider-thumb"
              id="sliderThumb"
              tabindex="0"
              aria-label="Steering handle"
            >
              ☝
            </div>
          </div>
          <p class="fine-print">
            Cars may change lanes. Trucks occupy more road. The collision box is
            slightly smaller than the artwork.
          </p>
        </div>
      </section>
    </main>

    <script>
      "use strict";

      /*
      OPTIONAL SPRITES
      ----------------
      Put image paths below. Leave a value empty to use the built-in drawings.
      Transparent PNG or WebP files work best.

      Example:
        player: "sprites/player-blue.webp",
        cars: ["sprites/car-red.webp", "sprites/car-white.webp"],
        trucks: ["sprites/truck-white.webp"]
    */
      const ASSETS = {
        player: "",
        cars: [],
        trucks: [],
      };

      const CONFIG = {
        lanes: 6,
        surviveSeconds: 30,
        playerWidthRatio: 0.102,
        playerHeightRatio: 0.155,
        carWidthRatio: 0.098,
        carHeightRatio: 0.155,
        truckWidthRatio: 0.112,
        truckHeightRatio: 0.285,
        baseTrafficSpeed: 0.34,
        maxTrafficSpeed: 0.57,
        laneChangeChance: 0.42,
        truckChance: 0.16,
      };

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d", { alpha: false });
      const canvasWrap = document.getElementById("canvasWrap");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const startButton = document.getElementById("startButton");
      const slider = document.getElementById("slider");
      const sliderThumb = document.getElementById("sliderThumb");
      const laneReadout = document.getElementById("laneReadout");
      const statusPill = document.getElementById("statusPill");
      const timeText = document.getElementById("timeText");
      const scoreText = document.getElementById("scoreText");

      const CAR_COLORS = [
        "#d74843",
        "#e8e9e6",
        "#35393c",
        "#777b7d",
        "#e0d9c9",
        "#c83a34",
      ];

      const images = {
        player: null,
        cars: [],
        trucks: [],
      };

      const state = {
        mode: "ready", // ready | playing | crashed | won
        width: 400,
        height: 480,
        roadLeft: 22,
        roadRight: 378,
        roadWidth: 356,
        laneWidth: 59.33,
        elapsed: 0,
        remaining: CONFIG.surviveSeconds,
        score: 0,
        roadOffset: 0,
        spawnTimer: 0,
        nextSpawn: 0.8,
        steering: 0.5,
        targetX: 200,
        traffic: [],
        particles: [],
        lastTime: 0,
        animationId: 0,
        dragPointerId: null,
        shake: 0,
      };

      const player = {
        x: 0,
        y: 0,
        width: 38,
        height: 70,
        angle: 0,
      };

      function loadImage(url) {
        return new Promise((resolve) => {
          if (!url) return resolve(null);
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => {
            console.warn("Could not load sprite:", url);
            resolve(null);
          };
          image.src = url;
        });
      }

      async function loadAssets() {
        images.player = await loadImage(ASSETS.player);
        images.cars = (await Promise.all(ASSETS.cars.map(loadImage))).filter(
          Boolean,
        );
        images.trucks = (
          await Promise.all(ASSETS.trucks.map(loadImage))
        ).filter(Boolean);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function random(min, max) {
        return min + Math.random() * (max - min);
      }

      function choose(array) {
        return array[Math.floor(Math.random() * array.length)];
      }

      function resizeCanvas() {
        const rect = canvasWrap.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        state.width = rect.width;
        state.height = rect.height;
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        canvas.style.width = rect.width + "px";
        canvas.style.height = rect.height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = false;

        const shoulder = state.width * 0.065;
        state.roadLeft = shoulder;
        state.roadRight = state.width - shoulder;
        state.roadWidth = state.roadRight - state.roadLeft;
        state.laneWidth = state.roadWidth / CONFIG.lanes;

        player.width = state.roadWidth * CONFIG.playerWidthRatio;
        player.height = state.height * CONFIG.playerHeightRatio;
        player.y = state.height - player.height * 0.72;
        updateSteering(state.steering, true);

        // Keep traffic aligned after a responsive resize.
        for (const vehicle of state.traffic) {
          vehicle.width =
            state.roadWidth *
            (vehicle.type === "truck"
              ? CONFIG.truckWidthRatio
              : CONFIG.carWidthRatio);
          vehicle.height =
            state.height *
            (vehicle.type === "truck"
              ? CONFIG.truckHeightRatio
              : CONFIG.carHeightRatio);
          vehicle.x = laneCenter(vehicle.displayLane);
        }

        render();
      }

      function laneCenter(lane) {
        return state.roadLeft + state.laneWidth * (lane + 0.5);
      }

      function nearestLaneFromX(x) {
        return clamp(
          Math.floor((x - state.roadLeft) / state.laneWidth),
          0,
          CONFIG.lanes - 1,
        );
      }

      function updateSteering(value, instant = false) {
        state.steering = clamp(value, 0, 1);
        slider.setAttribute(
          "aria-valuenow",
          String(Math.round(state.steering * 100)),
        );
        sliderThumb.style.left = `${state.steering * 100}%`;

        const half = player.width * 0.52;
        state.targetX = lerp(
          state.roadLeft + half,
          state.roadRight - half,
          state.steering,
        );
        if (instant || state.mode !== "playing") player.x = state.targetX;

        const lane = nearestLaneFromX(state.targetX);
        laneReadout.textContent = `Lane ${lane + 1}`;
      }

      function setSteeringFromPointer(event) {
        const rect = slider.getBoundingClientRect();
        const thumbHalf = sliderThumb.offsetWidth / 2;
        const usable = Math.max(1, rect.width - thumbHalf * 2);
        const local = event.clientX - rect.left - thumbHalf;
        updateSteering(local / usable);
      }

      slider.addEventListener("pointerdown", (event) => {
        state.dragPointerId = event.pointerId;
        slider.setPointerCapture(event.pointerId);
        slider.classList.add("dragging");
        setSteeringFromPointer(event);
      });

      slider.addEventListener("pointermove", (event) => {
        if (state.dragPointerId !== event.pointerId) return;
        setSteeringFromPointer(event);
      });

      function finishSliderDrag(event) {
        if (state.dragPointerId !== event.pointerId) return;
        state.dragPointerId = null;
        slider.classList.remove("dragging");
        if (slider.hasPointerCapture(event.pointerId))
          slider.releasePointerCapture(event.pointerId);
      }

      slider.addEventListener("pointerup", finishSliderDrag);
      slider.addEventListener("pointercancel", finishSliderDrag);

      function handleSteeringKey(event) {
        const key = event.key.toLowerCase();
        if (!["arrowleft", "arrowright", "a", "d"].includes(key)) return;
        event.preventDefault();
        const direction = key === "arrowleft" || key === "a" ? -1 : 1;
        updateSteering(state.steering + direction * 0.055);
      }

      window.addEventListener("keydown", handleSteeringKey, { passive: false });

      startButton.addEventListener("click", startGame);
      window.addEventListener("resize", resizeCanvas);

      function resetGame() {
        state.mode = "ready";
        state.elapsed = 0;
        state.remaining = CONFIG.surviveSeconds;
        state.score = 0;
        state.roadOffset = 0;
        state.spawnTimer = 0;
        state.nextSpawn = 0.72;
        state.traffic.length = 0;
        state.particles.length = 0;
        state.shake = 0;
        state.lastTime = 0;
        updateSteering(0.5, true);
        syncHud();
      }

      function startGame() {
        cancelAnimationFrame(state.animationId);
        resetGame();
        state.mode = "playing";
        overlay.hidden = true;
        statusPill.textContent = "DRIVE";
        state.animationId = requestAnimationFrame(gameLoop);
      }

      function finishGame(won) {
        state.mode = won ? "won" : "crashed";
        statusPill.textContent = won ? "PASSED" : "CRASH";
        overlay.hidden = false;
        overlayTitle.textContent = won ? "Road cleared" : "You crashed";
        overlayText.textContent = won
          ? `Verified. Final score: ${Math.floor(state.score).toString().padStart(4, "0")}.`
          : `You lasted ${state.elapsed.toFixed(1)} seconds. Try a smoother steering line.`;
        startButton.textContent = won ? "Play again" : "Retry";
      }

      function syncHud() {
        timeText.textContent = Math.max(0, state.remaining).toFixed(1);
        scoreText.textContent = Math.floor(state.score)
          .toString()
          .padStart(4, "0");
      }

      function gameLoop(timestamp) {
        if (state.mode !== "playing") {
          render();
          return;
        }

        if (!state.lastTime) state.lastTime = timestamp;
        const dt = Math.min((timestamp - state.lastTime) / 1000, 0.033);
        state.lastTime = timestamp;

        update(dt);
        render();

        if (state.mode === "playing") {
          state.animationId = requestAnimationFrame(gameLoop);
        }
      }

      function update(dt) {
        state.elapsed += dt;
        state.remaining = CONFIG.surviveSeconds - state.elapsed;
        state.score += dt * (35 + state.elapsed * 1.7);

        const progress = clamp(state.elapsed / CONFIG.surviveSeconds, 0, 1);
        const trafficSpeed =
          lerp(CONFIG.baseTrafficSpeed, CONFIG.maxTrafficSpeed, progress) *
          state.height;
        state.roadOffset =
          (state.roadOffset + trafficSpeed * dt) % (state.height * 0.14);

        // Smooth steering keeps the slider readable without making the car teleport.
        const steeringStrength = 1 - Math.pow(0.0006, dt);
        const previousX = player.x;
        player.x = lerp(player.x, state.targetX, steeringStrength);
        const horizontalVelocity = (player.x - previousX) / Math.max(dt, 0.001);
        player.angle = clamp(horizontalVelocity / 900, -0.12, 0.12);

        state.spawnTimer += dt;
        if (state.spawnTimer >= state.nextSpawn) {
          state.spawnTimer = 0;
          spawnTrafficWave(progress);
          state.nextSpawn = random(0.52, 0.92) * lerp(1, 0.7, progress);
        }

        for (const vehicle of state.traffic) {
          updateVehicle(vehicle, dt, trafficSpeed, progress);
        }

        state.traffic = state.traffic.filter(
          (vehicle) => vehicle.y < state.height + vehicle.height,
        );

        updateParticles(dt);

        for (const vehicle of state.traffic) {
          if (intersectsPlayer(vehicle)) {
            createCrashParticles();
            state.shake = 11;
            finishGame(false);
            render();
            return;
          }
        }

        if (state.remaining <= 0) {
          state.remaining = 0;
          finishGame(true);
        }

        state.shake = Math.max(0, state.shake - dt * 28);
        syncHud();
      }

      function spawnTrafficWave(progress) {
        const desiredCount = Math.random() < lerp(0.35, 0.68, progress) ? 2 : 1;
        const candidateLanes = shuffle([...Array(CONFIG.lanes).keys()]);
        let spawned = 0;

        for (const lane of candidateLanes) {
          if (spawned >= desiredCount) break;
          if (!laneClearForSpawn(lane)) continue;

          const isTruck =
            Math.random() < CONFIG.truckChance * lerp(0.75, 1.35, progress);
          createVehicle(lane, isTruck ? "truck" : "car", progress);
          spawned++;
        }
      }

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      function laneClearForSpawn(lane) {
        return !state.traffic.some(
          (vehicle) =>
            Math.abs(vehicle.displayLane - lane) < 0.4 &&
            vehicle.y < state.height * 0.32,
        );
      }

      function createVehicle(lane, type, progress) {
        const isTruck = type === "truck";
        const height =
          state.height *
          (isTruck ? CONFIG.truckHeightRatio : CONFIG.carHeightRatio);
        const width =
          state.roadWidth *
          (isTruck ? CONFIG.truckWidthRatio : CONFIG.carWidthRatio);
        const canChange =
          !isTruck &&
          Math.random() < CONFIG.laneChangeChance * lerp(0.72, 1.18, progress);

        state.traffic.push({
          type,
          lane,
          displayLane: lane,
          targetLane: lane,
          x: laneCenter(lane),
          y: -height * random(0.65, 1.35),
          width,
          height,
          speedFactor: isTruck ? random(0.78, 0.95) : random(0.91, 1.18),
          color: choose(CAR_COLORS),
          sprite: isTruck ? choose(images.trucks) : choose(images.cars),
          canChange,
          changeTimer: canChange ? random(0.7, 2.6) : Infinity,
          laneChangeDuration: random(0.65, 1.05),
          laneChangeProgress: 1,
          fromLane: lane,
          indicatorPhase: random(0, Math.PI * 2),
        });
      }

      function updateVehicle(vehicle, dt, baseSpeed, progress) {
        vehicle.y += baseSpeed * vehicle.speedFactor * dt;
        vehicle.indicatorPhase += dt * 11;

        if (vehicle.canChange && vehicle.laneChangeProgress >= 1) {
          vehicle.changeTimer -= dt;
          if (
            vehicle.changeTimer <= 0 &&
            vehicle.y > state.height * 0.05 &&
            vehicle.y < state.height * 0.7
          ) {
            attemptLaneChange(vehicle, progress);
            vehicle.changeTimer = random(1.0, 3.0);
          }
        }

        if (vehicle.laneChangeProgress < 1) {
          vehicle.laneChangeProgress = Math.min(
            1,
            vehicle.laneChangeProgress + dt / vehicle.laneChangeDuration,
          );
          const t = smoothStep(vehicle.laneChangeProgress);
          vehicle.displayLane = lerp(vehicle.fromLane, vehicle.targetLane, t);
          vehicle.x = laneCenter(vehicle.displayLane);

          if (vehicle.laneChangeProgress >= 1) {
            vehicle.lane = vehicle.targetLane;
            vehicle.displayLane = vehicle.targetLane;
          }
        } else {
          vehicle.x = laneCenter(vehicle.lane);
        }
      }

      function smoothStep(t) {
        return t * t * (3 - 2 * t);
      }

      function attemptLaneChange(vehicle, progress) {
        const directions = Math.random() < 0.5 ? [-1, 1] : [1, -1];

        for (const direction of directions) {
          const targetLane = vehicle.lane + direction;
          if (targetLane < 0 || targetLane >= CONFIG.lanes) continue;
          if (!safeLaneGap(vehicle, targetLane)) continue;

          vehicle.fromLane = vehicle.lane;
          vehicle.targetLane = targetLane;
          vehicle.laneChangeProgress = 0;
          vehicle.laneChangeDuration =
            random(0.65, 1.0) * lerp(1.0, 0.82, progress);
          return;
        }
      }

      function safeLaneGap(vehicle, targetLane) {
        const requiredGap = vehicle.height * 1.35;
        return !state.traffic.some(
          (other) =>
            other !== vehicle &&
            Math.abs(other.displayLane - targetLane) < 0.55 &&
            Math.abs(other.y - vehicle.y) < requiredGap,
        );
      }

      function intersectsPlayer(vehicle) {
        // Smaller hitboxes make visual near-misses feel fair.
        const p = {
          left: player.x - player.width * 0.34,
          right: player.x + player.width * 0.34,
          top: player.y - player.height * 0.39,
          bottom: player.y + player.height * 0.39,
        };

        const shrinkX = vehicle.type === "truck" ? 0.34 : 0.31;
        const shrinkY = vehicle.type === "truck" ? 0.43 : 0.39;
        const v = {
          left: vehicle.x - vehicle.width * shrinkX,
          right: vehicle.x + vehicle.width * shrinkX,
          top: vehicle.y - vehicle.height * shrinkY,
          bottom: vehicle.y + vehicle.height * shrinkY,
        };

        return (
          p.left < v.right &&
          p.right > v.left &&
          p.top < v.bottom &&
          p.bottom > v.top
        );
      }

      function createCrashParticles() {
        for (let i = 0; i < 24; i++) {
          const angle = random(0, Math.PI * 2);
          const speed = random(45, 180);
          state.particles.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: random(0.35, 0.85),
            maxLife: 0.85,
            size: random(2, 6),
            color: choose(["#ffffff", "#f0b84d", "#d74843", "#30333b"]),
          });
        }
      }

      function updateParticles(dt) {
        for (const p of state.particles) {
          p.life -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 180 * dt;
        }
        state.particles = state.particles.filter((p) => p.life > 0);
      }

      function render() {
        ctx.save();
        if (state.shake > 0) {
          ctx.translate(
            random(-state.shake, state.shake),
            random(-state.shake, state.shake),
          );
        }

        drawRoad();

        const sortedTraffic = [...state.traffic].sort((a, b) => a.y - b.y);
        for (const vehicle of sortedTraffic) drawVehicle(vehicle);

        drawPlayer();
        drawParticles();
        ctx.restore();
      }

      function drawRoad() {
        // Grass shoulders
        ctx.fillStyle = "#b7c68d";
        ctx.fillRect(0, 0, state.width, state.height);
        drawGrassNoise(0, state.roadLeft, state.height);
        drawGrassNoise(
          state.roadRight,
          state.width - state.roadRight,
          state.height,
        );

        // Concrete gutters
        ctx.fillStyle = "#dad9d2";
        ctx.fillRect(state.roadLeft - 8, 0, 8, state.height);
        ctx.fillRect(state.roadRight, 0, 8, state.height);
        ctx.fillStyle = "#868985";
        ctx.fillRect(state.roadLeft - 3, 0, 3, state.height);
        ctx.fillRect(state.roadRight, 0, 3, state.height);

        // Asphalt
        ctx.fillStyle = "#aaa9a4";
        ctx.fillRect(state.roadLeft, 0, state.roadWidth, state.height);

        // Subtle alternating lane tone
        for (let lane = 0; lane < CONFIG.lanes; lane++) {
          if (lane % 2 === 0) {
            ctx.fillStyle = "rgba(255,255,255,.035)";
            ctx.fillRect(
              state.roadLeft + lane * state.laneWidth,
              0,
              state.laneWidth,
              state.height,
            );
          }
        }

        // Asphalt grain
        ctx.fillStyle = "rgba(40,40,40,.055)";
        for (let i = 0; i < 120; i++) {
          const x = state.roadLeft + ((i * 97) % Math.max(1, state.roadWidth));
          const y = (i * 53 + state.roadOffset * 0.35) % state.height;
          ctx.fillRect(x, y, 1, 1);
        }

        // Dashed lane dividers
        const dashHeight = state.height * 0.062;
        const gap = state.height * 0.075;
        const cycle = dashHeight + gap;
        ctx.fillStyle = "rgba(255,255,255,.88)";
        for (let lane = 1; lane < CONFIG.lanes; lane++) {
          const x = state.roadLeft + lane * state.laneWidth;
          for (
            let y = -cycle + state.roadOffset;
            y < state.height + cycle;
            y += cycle
          ) {
            ctx.fillRect(
              Math.round(x - 1),
              Math.round(y),
              2,
              Math.round(dashHeight),
            );
          }
        }
      }

      function drawGrassNoise(x, width, height) {
        ctx.fillStyle = "rgba(72,96,44,.16)";
        for (let i = 0; i < 44; i++) {
          const px = x + ((i * 31) % Math.max(1, width));
          const py = (i * 71 + state.roadOffset * 0.18) % height;
          ctx.fillRect(px, py, 2, 4);
        }
      }

      function drawVehicle(vehicle) {
        ctx.save();
        ctx.translate(vehicle.x, vehicle.y);

        if (vehicle.laneChangeProgress < 1) {
          const direction = Math.sign(vehicle.targetLane - vehicle.fromLane);
          ctx.rotate(
            direction * 0.045 * Math.sin(Math.PI * vehicle.laneChangeProgress),
          );
        }

        if (vehicle.sprite) {
          ctx.drawImage(
            vehicle.sprite,
            -vehicle.width / 2,
            -vehicle.height / 2,
            vehicle.width,
            vehicle.height,
          );
        } else if (vehicle.type === "truck") {
          drawTruck(vehicle.width, vehicle.height, vehicle.color);
        } else {
          drawCar(vehicle.width, vehicle.height, vehicle.color, false);
        }

        if (
          vehicle.laneChangeProgress < 1 &&
          Math.sin(vehicle.indicatorPhase) > 0
        ) {
          const dir = Math.sign(vehicle.targetLane - vehicle.fromLane);
          ctx.fillStyle = "#ffb42e";
          ctx.fillRect(
            dir > 0 ? vehicle.width * 0.25 : -vehicle.width * 0.38,
            vehicle.height * 0.18,
            vehicle.width * 0.13,
            vehicle.height * 0.07,
          );
        }

        ctx.restore();
      }

      function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.angle);

        if (images.player) {
          ctx.drawImage(
            images.player,
            -player.width / 2,
            -player.height / 2,
            player.width,
            player.height,
          );
        } else {
          drawCar(player.width, player.height, "#397fe5", true);
        }

        ctx.restore();
      }

      function drawCar(width, height, color, playerCar) {
        const x = -width / 2;
        const y = -height / 2;

        // Shadow
        ctx.fillStyle = "rgba(0,0,0,.22)";
        roundRect(
          ctx,
          x + width * 0.08,
          y + height * 0.07,
          width * 0.92,
          height * 0.94,
          width * 0.18,
          true,
        );

        // Tires
        ctx.fillStyle = "#242629";
        const tireW = width * 0.15;
        const tireH = height * 0.18;
        ctx.fillRect(x - tireW * 0.18, y + height * 0.18, tireW, tireH);
        ctx.fillRect(x + width - tireW * 0.82, y + height * 0.18, tireW, tireH);
        ctx.fillRect(x - tireW * 0.18, y + height * 0.65, tireW, tireH);
        ctx.fillRect(x + width - tireW * 0.82, y + height * 0.65, tireW, tireH);

        // Body
        ctx.fillStyle = color;
        roundRect(ctx, x, y, width, height, width * 0.2, true);
        ctx.fillStyle = shadeColor(color, -16);
        roundRect(
          ctx,
          x + width * 0.08,
          y + height * 0.08,
          width * 0.84,
          height * 0.84,
          width * 0.15,
          true,
        );

        // Roof and glass
        ctx.fillStyle = playerCar ? "#9fc7ff" : "#c9d3d7";
        roundRect(
          ctx,
          x + width * 0.18,
          y + height * 0.22,
          width * 0.64,
          height * 0.24,
          width * 0.1,
          true,
        );
        ctx.fillStyle = "#263642";
        roundRect(
          ctx,
          x + width * 0.19,
          y + height * 0.52,
          width * 0.62,
          height * 0.2,
          width * 0.08,
          true,
        );

        // Center roof stripe
        ctx.fillStyle = "rgba(255,255,255,.17)";
        ctx.fillRect(
          x + width * 0.47,
          y + height * 0.08,
          width * 0.08,
          height * 0.76,
        );

        // Lights
        ctx.fillStyle = "#ffe690";
        ctx.fillRect(
          x + width * 0.13,
          y + height * 0.035,
          width * 0.2,
          height * 0.065,
        );
        ctx.fillRect(
          x + width * 0.67,
          y + height * 0.035,
          width * 0.2,
          height * 0.065,
        );
        ctx.fillStyle = "#931e20";
        ctx.fillRect(
          x + width * 0.14,
          y + height * 0.9,
          width * 0.18,
          height * 0.055,
        );
        ctx.fillRect(
          x + width * 0.68,
          y + height * 0.9,
          width * 0.18,
          height * 0.055,
        );

        // Outline
        ctx.strokeStyle = "#26282c";
        ctx.lineWidth = Math.max(1, width * 0.045);
        roundRect(ctx, x, y, width, height, width * 0.2, false, true);
      }

      function drawTruck(width, height, color) {
        const x = -width / 2;
        const y = -height / 2;
        const cabH = height * 0.32;

        ctx.fillStyle = "rgba(0,0,0,.23)";
        roundRect(
          ctx,
          x + width * 0.08,
          y + height * 0.05,
          width,
          height * 0.97,
          width * 0.12,
          true,
        );

        // Trailer
        ctx.fillStyle = color === "#35393c" ? "#707477" : "#ece9df";
        roundRect(
          ctx,
          x,
          y + cabH * 0.82,
          width,
          height - cabH * 0.82,
          width * 0.08,
          true,
        );
        ctx.fillStyle = "rgba(0,0,0,.08)";
        for (let i = 1; i < 7; i++) {
          const yy = y + cabH + (height - cabH) * (i / 7);
          ctx.fillRect(x + width * 0.08, yy, width * 0.84, 2);
        }

        // Cab
        ctx.fillStyle = color;
        roundRect(ctx, x, y, width, cabH, width * 0.16, true);
        ctx.fillStyle = "#263642";
        roundRect(
          ctx,
          x + width * 0.13,
          y + cabH * 0.16,
          width * 0.74,
          cabH * 0.4,
          width * 0.08,
          true,
        );
        ctx.fillStyle = "#ffe690";
        ctx.fillRect(
          x + width * 0.12,
          y + cabH * 0.72,
          width * 0.21,
          cabH * 0.12,
        );
        ctx.fillRect(
          x + width * 0.67,
          y + cabH * 0.72,
          width * 0.21,
          cabH * 0.12,
        );

        // Wheels
        ctx.fillStyle = "#242629";
        const wheelW = width * 0.16;
        const wheelH = height * 0.1;
        for (const py of [height * 0.18, height * 0.58, height * 0.79]) {
          ctx.fillRect(x - width * 0.05, y + py, wheelW, wheelH);
          ctx.fillRect(
            x + width - wheelW + width * 0.05,
            y + py,
            wheelW,
            wheelH,
          );
        }

        ctx.strokeStyle = "#25272a";
        ctx.lineWidth = Math.max(1, width * 0.045);
        roundRect(ctx, x, y, width, height, width * 0.09, false, true);
      }

      function shadeColor(hex, amount) {
        const value = hex.replace("#", "");
        if (value.length !== 6) return hex;
        const number = parseInt(value, 16);
        const r = clamp((number >> 16) + amount, 0, 255);
        const g = clamp(((number >> 8) & 0xff) + amount, 0, 255);
        const b = clamp((number & 0xff) + amount, 0, 255);
        return `rgb(${r}, ${g}, ${b})`;
      }

      function roundRect(
        context,
        x,
        y,
        width,
        height,
        radius,
        fill,
        stroke = false,
      ) {
        const r = Math.min(radius, width / 2, height / 2);
        context.beginPath();
        context.moveTo(x + r, y);
        context.arcTo(x + width, y, x + width, y + height, r);
        context.arcTo(x + width, y + height, x, y + height, r);
        context.arcTo(x, y + height, x, y, r);
        context.arcTo(x, y, x + width, y, r);
        context.closePath();
        if (fill) context.fill();
        if (stroke) context.stroke();
      }

      function drawParticles() {
        for (const p of state.particles) {
          ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        }
        ctx.globalAlpha = 1;
      }

      // Initialize after optional sprites are resolved.
      loadAssets().finally(() => {
        resizeCanvas();
        resetGame();
        render();
      });
    </script>
  </body>
</html>
